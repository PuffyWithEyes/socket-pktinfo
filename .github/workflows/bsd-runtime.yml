name: BSD runtime validation
on:
  push:
    branches: [ci/bsd-runtime]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [FreeBSD, OpenBSD, NetBSD, DragonFly]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: git rev-parse HEAD
      - if: matrix.os == 'FreeBSD'
        uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b
        with:
          release: '15.1'
          sync: nfs
          mem: '4096'
          cpu: '2'
          run: sh ci/bsd-runtime.sh
      - if: matrix.os == 'OpenBSD'
        uses: vmactions/openbsd-vm@f1ca8bc8ecc5b6ef7218e5b914836e067e1546d3
        with:
          release: '7.9'
          sync: nfs
          mem: '4096'
          cpu: '2'
          run: sh ci/bsd-runtime.sh
      - if: matrix.os == 'NetBSD'
        uses: vmactions/netbsd-vm@5957cf330aef2e6ddc63c604364c99ce2e02b91d
        with:
          release: '10.1'
          sync: nfs
          mem: '4096'
          cpu: '2'
          run: sh ci/bsd-runtime.sh
      - if: matrix.os == 'DragonFly'
        uses: vmactions/dragonflybsd-vm@4ab776fa9f914fbea72f13715b451e77e7ef5c41
        with:
          release: '6.4.2'
          sync: nfs
          mem: '4096'
          cpu: '2'
          run: sh ci/bsd-runtime.sh
